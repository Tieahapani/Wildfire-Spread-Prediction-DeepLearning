# Loss comparison on the U-Net (experiment 2), arm 4: 0.4 weighted BCE + 0.3 Dice
# + 0.3 focal. Dice scores the overlap of the whole predicted fire area, which the
# per-pixel terms do not.
base: ../train/default.yaml
loss_terms: {bce: 0.4, dice: 0.3, focal: 0.3}
pos_weight: 3.0
focal_gamma: 2.0
focal_alpha: 0.25
